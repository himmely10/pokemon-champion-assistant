name: Build Windows release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-candidate
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: ${{ github.workspace }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-data.txt
            requirements-ui.txt
            requirements-ocr.txt
            requirements-build.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22.20.0'
      - name: Install pinned build and offline OCR dependencies
        run: python -m pip install -r requirements-build.txt pytest
      - name: Download and verify the three official offline OCR models
        shell: python
        run: |
          from hashlib import sha256
          import importlib.util
          import json
          from pathlib import Path
          from urllib.request import urlopen
          import yaml
          package = Path(importlib.util.find_spec('rapidocr').origin).parent
          catalog = yaml.safe_load((package / 'default_models.yaml').read_text(encoding='utf-8'))['onnxruntime']
          expected = [
              ('PP-OCRv6', 'det', 'multi_PP-OCRv6_det_small', '090f04abcd9d9a7498bc4ebf677e4cb9bdce1fe4197ddb7e529f1ef44e1ff94f'),
              ('PP-OCRv6', 'rec', 'multi_PP-OCRv6_rec_small', '6f327246b50388f3c176ae304bd95767ea6dc0c9ae92153ef8cbe210b3c14884'),
              ('PP-OCRv4', 'cls', 'ch_ppocr_mobile_v2.0_cls_mobile', 'e47acedf663230f8863ff1ab0e64dd2d82b838fceb5957146dab185a89d6215c'),
          ]
          evidence = []
          for version, kind, key, checksum in expected:
              row = catalog[version][kind][key]
              url = row['model_dir']
              if not url.startswith('https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.9.2/') or row['SHA256'] != checksum:
                  raise ValueError('Pinned official OCR model metadata changed')
              path = package / 'models' / url.rsplit('/', 1)[1]
              if not path.exists() or sha256(path.read_bytes()).hexdigest() != checksum:
                  with urlopen(url, timeout=90) as response:
                      content = response.read(100 * 1024 * 1024 + 1)
                  if len(content) > 100 * 1024 * 1024 or sha256(content).hexdigest() != checksum:
                      raise ValueError('OCR download size/hash mismatch')
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(content)
              evidence.append({'name': path.name, 'source_url': url, 'sha256': checksum, 'bytes': path.stat().st_size})
          target = Path('artifacts/release/model-sources.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps({'rapidocr': '3.9.2', 'models': evidence}, indent=2), encoding='utf-8')
      - name: Test release manifest gate
        run: python -m pytest tests/test_release_manifest.py -q
      - name: Build and install the bundled data combination
        shell: python
        run: |
          import json
          import subprocess
          import sys
          from champion_assistant.data.update_service import UpdateService
          result = subprocess.run([sys.executable, '-X', 'utf8', 'scripts/build_data_bundle.py', '--data-dir', 'pokemon', '--output-dir', 'artifacts/data-dist'], capture_output=True, text=True, encoding='utf-8', check=True)
          print(result.stdout)
          meta = json.loads(result.stdout)
          print(UpdateService('artifacts/release-data').install(meta['archive_path']))
      - name: Build frozen Windows application
        run: python -X utf8 scripts/build_windows.py --data-dir artifacts/release-data
      - name: Verify exact resources included in frozen application
        shell: python
        run: |
          from scripts.build_windows import validate_build_manifest
          manifest = validate_build_manifest('artifacts/dist/PokemonChampionAssistant/_internal')
          print('Validated', len(manifest['files']), 'resource hashes for version', manifest['version'])
      - name: Run actual frozen diagnostics without development runtimes on PATH
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          root = Path.cwd()
          env = os.environ.copy()
          env.pop('PYTHONPATH', None)
          windows = Path(env.get('SystemRoot', 'C:/Windows'))
          env['PATH'] = str(windows / 'System32') + os.pathsep + str(windows)
          env['CHAMPION_USER_DIR'] = str(root / 'artifacts/frozen-test-user')
          output = root / 'artifacts/release/frozen-self-check.json'
          exe = root / 'artifacts/dist/PokemonChampionAssistant/ChampionWorker.exe'
          subprocess.run([str(exe), '--self-check', '--exercise-user-store', '--output', str(output), '--image', str(root / '图片/例子.png'), '--ability', str(root / 'tests/fixtures/team_import/ability.png'), '--status', str(root / 'tests/fixtures/team_import/status.png')], check=True, timeout=240, env=env, cwd=windows)
          report = json.loads(output.read_text(encoding='utf-8'))
          if report.get('status') != 'ok' or report.get('frozen') is not True:
              raise ValueError('Frozen diagnostic did not succeed')
          if report['checks']['recognition']['recognized_count'] != 6 or len(report['checks']['ocr']['draft']['members']) != 6:
              raise ValueError('Packaged recognition/OCR smoke output incomplete')
          print('Frozen catalog, node, team store, damage, recognition and OCR smoke passed')
      - name: Compile candidate installer with Inno Setup
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Runner Inno Setup compiler is unavailable' }
          $appVersion = python -c "from champion_assistant.version import __version__; print(__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve application version' }
          & $compiler "/DAppVersion=$appVersion" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
      - name: Record installer hash and candidate status
        shell: python
        run: |
          from hashlib import sha256
          import json
          from pathlib import Path
          import shutil
          from champion_assistant.version import __version__
          root = Path('artifacts/release')
          installers = list(root.glob('*-Setup.exe'))
          if len(installers) != 1:
              raise ValueError('Expected exactly one candidate installer')
          installer = installers[0]
          shutil.copy2('artifacts/dist/PokemonChampionAssistant/_internal/build-manifest.json', root / 'build-manifest.json')
          manifest = {'schema_version': 1, 'version': __version__, 'status': 'candidate', 'installer': installer.name,
                      'sha256': sha256(installer.read_bytes()).hexdigest(), 'bytes': installer.stat().st_size,
                      'frozen_smoke': 'passed', 'clean_windows_vm': 'not_verified',
                      'stable_channel': 'not_deployed', 'code_signing': 'not_configured'}
          (root / 'release-candidate.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
      - name: Upload candidate and verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: pokemon-champion-assistant-windows-candidate
          path: artifacts/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      # A candidate artifact is not a stable release. Clean Windows installation,
      # upgrade, removal and real OBS capture remain manual release gates.
